<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RoomSense — Survey Dashboard</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="flex-between">
    <div>
      <h1>RoomSense</h1>
      <p class="sub">Wi-Fi RSSI Survey & Positioning</p>
    </div>
    <div>
      <span id="connBadge" class="badge badge-disconnected">Disconnected</span>
      <span id="flashBadge" class="badge badge-working">0 B</span>
    </div>
  </header>

  <!-- Connection & Session Card -->
  <div class="card">
    <div class="flex-between" style="margin-bottom: 0.8rem;">
      <div>
        <button id="btnConnect" class="btn-primary">Connect Board</button>
        <button id="btnDisconnect" class="btn-outline" disabled>Disconnect</button>
      </div>
      <div>
        <button id="btnExportCSV" class="btn-success">Export CSV</button>
      </div>
    </div>

    <div class="flex-between" style="font-size: 0.9rem;">
      <div>
        <label for="sessionSelect">Session:</label>
        <select id="sessionSelect" style="padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid var(--border);">
          <option value="session1">session1</option>
          <option value="session2">session2</option>
          <option value="session3">session3</option>
        </select>
        <button id="newSessionBtn" class="btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">+ New</button>
      </div>
      <div>
        <label for="targetScansInput">Target / Zone:</label>
        <input type="number" id="targetScansInput" value="25" min="5" max="50" style="width: 55px; padding: 0.3rem; border-radius: 6px; border: 1px solid var(--border);">
      </div>
    </div>
  </div>

  <!-- Interactive Floor Map Card -->
  <div class="card">
    <!-- Mode Tabs: Survey vs Live Tracking -->
    <div class="mode-tabs">
      <button id="tabSurvey" class="tab-btn active">📋 Survey Mode</button>
      <button id="tabTracking" class="tab-btn">📡 Live Tracking</button>
    </div>

    <div class="flex-between">
      <strong id="mapCardTitle">Flat Map</strong>
      <span id="surveyStatusText" class="sub">Tap a room to select</span>
    </div>

    <div id="mapContainer">
      <svg id="floorMap" viewBox="0 0 360 255" xmlns="http://www.w3.org/2000/svg">
        <!-- Zones rendered dynamically from zones.json -->
      </svg>
    </div>

    <!-- 1. SURVEY MODE SECTION -->
    <div id="surveySection">
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-fill"></div>
      </div>

      <div class="flex-between" style="margin-top: 0.8rem;">
        <button id="btnStartSurvey" class="btn-primary" disabled style="flex: 1; margin-right: 0.5rem;">Start Zone Survey</button>
        <button id="btnStopSurvey" class="btn-danger" disabled style="width: 90px;">Stop</button>
      </div>

      <div id="zoneGrid" class="zone-grid">
        <!-- Zone selection buttons generated dynamically -->
      </div>
    </div>

    <!-- 2. LIVE TRACKING MODE SECTION (Directly under the Map!) -->
    <div id="trackingSection" style="display: none; margin-top: 0.8rem;">
      <div class="flex-between" style="margin-bottom: 0.5rem;">
        <span class="sub"><strong>Model & Tracking:</strong></span>
        <div>
          <input type="file" id="modelFileInput" accept=".json" style="display: none;">
          <button id="btnLoadModel" class="btn-primary" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;">📁 Load model.json</button>
        </div>
      </div>

      <!-- Parity & Model Status Banner -->
      <div id="modelStatusBanner" class="model-banner">
        No model loaded. Export <code>model.json</code> on laptop and load here.
      </div>

      <!-- Tracking Configuration -->
      <div class="flex-between" style="font-size: 0.85rem; margin: 0.6rem 0;">
        <div>
          <label for="modelEngineSelect"><strong>Model:</strong></label>
          <select id="modelEngineSelect" style="padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid var(--border);">
            <option value="knn">Weighted kNN (k=3)</option>
            <option value="nb">Gaussian Naive Bayes</option>
          </select>
        </div>
        <div>
          <label style="cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
            <input type="checkbox" id="beliefFilterToggle" checked>
            <span>Movement Filter</span>
          </label>
        </div>
      </div>

      <!-- Tracking Stream Controls -->
      <div class="flex-between" style="margin-top: 0.6rem;">
        <button id="btnStartTracking" class="btn-success" disabled style="flex: 1; margin-right: 0.5rem;">▶ Start Live Tracking</button>
        <button id="btnStopTracking" class="btn-danger" disabled style="width: 100px;">⏹ Stop</button>
      </div>

      <!-- Live Position Status Box -->
      <div class="live-status-box">
        <div class="flex-between">
          <div>
            <span class="sub block">Current Location:</span>
            <div id="liveRoomDisplay" class="live-room-title">—</div>
          </div>
          <div style="text-align: right;">
            <span class="sub block">Confidence:</span>
            <strong id="liveConfidenceDisplay" style="color: var(--primary); font-size: 1.15rem;">—</strong>
          </div>
        </div>
        <div class="flex-between" style="margin-top: 0.4rem; font-size: 0.75rem; color: var(--text-muted);">
          <span id="liveNoveltyDisplay">Novelty: —</span>
          <span id="liveFilterStatus">Filter: Active</span>
        </div>
      </div>
    </div>
  </div>

  <!-- System Console & Wipe -->
  <div class="card">
    <div class="flex-between" style="margin-bottom: 0.5rem;">
      <strong>Live Console</strong>
      <button id="btnClearDB" class="btn-outline" style="font-size: 0.75rem; padding: 0.2rem 0.5rem; color: var(--danger);">Clear Session Data</button>
    </div>
    <div id="log">Console ready. Connect your ESP32 to start surveying.</div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
